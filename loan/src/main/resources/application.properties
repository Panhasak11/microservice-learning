spring.application.name=loan
spring.datasource.url=jdbc:mysql://localhost:3306/loan_service_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create


server.port=8090

spring.profiles.active=dev
spring.config.import=optional:configserver:http://localhost:8071

# spring acutator and to exposes all end-point
management.endpoints.web.exposure.include=*

#for register service into eureka server 
eureka.instance.preferIpAddress=true
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone= http://localhost:9000/eureka

#configutaion info end-point
info.app.name = Loan Microservice
info.app.description = Panhasak Bank Loan App
info.app.version = 1.0.0
management.info.env.enabled=true